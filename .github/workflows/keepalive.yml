name: keepalive

# Pings the app so the Render free instance (spins down after 15 min idle) stays
# warm. GitHub's scheduler is best-effort and can be delayed; a free external
# monitor (cron-job.org / UptimeRobot, 5-min interval) on the same URL is more
# reliable. GitHub also disables schedules after 60 days without repo activity.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -o /dev/null --max-time 90 https://ched-compliance.onrender.com/login.php
